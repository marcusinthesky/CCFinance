# Pipeline layers: raw -> processed -> research.
# Each layer will contain independently reproducible DVC sub-stages.

## Raw: source snapshots
# Ingest versioned article and company-reference snapshots with source manifests.
# Preserve source content, metadata and provenance for replay and reconciliation.
# Proposed location: data/raw/.

## Processed: reusable tables
# Clean, standardize and deduplicate articles; resolve dated company identities
# and enrich article-company relationships. Retain evidence and quality flags.
# Produce reusable article, company and relationship tables.
# Proposed location: data/processed/.

## Research: study datasets
# Build company-year coverage panels, study cohorts and publication-ready datasets
# from processed tables. Apply explicit publisher, relevance and K/T coverage policies.
# Include dataset documentation, provenance and measured quality in each release.
# Proposed location: data/research/.

## Validation and evaluation
# Validate contracts and reconcile counts at every layer. Keep method experiments,
# independent evaluation labels and quality reports as versioned supporting
# artifacts; they inform promotion between layers rather than forming a data tier.

vars:
  - entity_templates: src/python/apps/pipeline/src/pipeline/experiments/entity_focus.py

stages:
  embed_article_bodies:
    desc: Encode frozen Fine News article bodies with the pinned EmbeddingGemma GPU worker.
    cmd: bash infra/inference/gemma-run.sh data/processed/embeddinggemma-embeddings
    deps:
      - data/raw/fine-news
      - infra/inference/gemma-run.sh
      - infra/inference/gemma_embed.py
    outs:
      - data/processed/embeddinggemma-embeddings:
          persist: true

  verify_body_vectors:
    cmd: >-
      env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python
      --offline --frozen --package ccfinance-pipeline pipeline stages processed
      verify-body-vectors --source data/raw/fine-news --vectors data/processed/embeddinggemma-embeddings
      --output data/processed/body-vector-audit/summary.json
    deps:
      - data/raw/fine-news
      - data/processed/embeddinggemma-embeddings
      - .semflow/hashes/entrypoints/pipeline/stages/processed/verify-body-vectors.json
    metrics:
      - data/processed/body-vector-audit/summary.json

  filter_fine_news:
    desc: Reproduce the historical English financial-publisher selection from Fine News.
    # Published monthly shards are restored here; provenance.json records their
    # Hub revision and checksums. Keep this acquisition frozen during experiments.
    cmd: >-
      env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python
      --offline --frozen --package ccfinance-pipeline pipeline stages raw filter-fine-news
    frozen: true
    deps:
      - data/inputs/fine-news/acquisition.json
      - data/inputs/fine-news/domains.csv
      - .semflow/hashes/entrypoints/pipeline/stages/raw/filter-fine-news.json
    outs:
      - data/raw/fine-news:
          push: false

  snapshot_issuers:
    desc: Snapshot SEC listings and identities, plus Wikidata tickers, names and subsidiaries.
    # Needs network access and SEC_USER_AGENT ("Name contact@example.org").
    # Frozen once recorded, so later runs verify the snapshot instead of refetching.
    cmd: >-
      env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python
      --offline --frozen --package ccfinance-pipeline pipeline stages raw snapshot-issuers
      --queries data/inputs/issuers --output data/raw/issuers
    frozen: true
    deps:
      - data/inputs/issuers/tickers.rq
      - data/inputs/issuers/names.rq
      - data/inputs/issuers/parents.rq
      - data/inputs/issuers/owners.rq
      - .semflow/hashes/entrypoints/pipeline/stages/raw/snapshot-issuers.json
    outs:
      - data/raw/issuers

  prepare_issuers:
    desc: Resolve listed CIKs, dated tickers and dated aliases for company linking.
    cmd: >-
      env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python
      --offline --frozen --package ccfinance-pipeline pipeline stages processed
      prepare-issuers --source data/raw/issuers
      --exchanges data/inputs/issuers/exchanges.csv --since ${issuers.since}
      --min-sitelinks ${issuers.min_sitelinks} --output data/processed/issuers
    params:
      - issuers
    deps:
      - data/raw/issuers
      - data/inputs/issuers/exchanges.csv
      - .semflow/hashes/entrypoints/pipeline/stages/processed/prepare-issuers.json
    outs:
      - data/processed/issuers

  prepare_comparison:
    foreach: ${experiments.source_comparison.datasets}
    do:
      desc: Prepare a probability sample and transfer estimates using metadata only.
      cmd: >-
        env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python
        --offline --frozen --package ccfinance-pipeline pipeline stages raw
        prepare-comparison --dataset ${key}
        --output data/raw/experiments/source-comparison/manifests/${key}
      params:
        - experiments.source_comparison.seed
        - experiments.source_comparison.draws
        - experiments.source_comparison.datasets.${key}
      deps:
        - .semflow/hashes/entrypoints/pipeline/stages/raw/prepare-comparison.json
      outs:
        - data/raw/experiments/source-comparison/manifests/${key}

  sample_comparison:
    foreach: ${experiments.source_comparison.datasets}
    do:
      desc: Acquire only the prepared row groups and retain English publisher matches.
      cmd: >-
        env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python
        --offline --frozen --package ccfinance-pipeline pipeline stages raw
        sample-comparison --dataset ${key}
        --manifest data/raw/experiments/source-comparison/manifests/${key}/manifest.json
        --output data/raw/experiments/source-comparison/samples/${key}
      params:
        - experiments.source_comparison.seed
        - experiments.source_comparison.draws
        - experiments.source_comparison.domains
        - experiments.source_comparison.datasets.${key}
      deps:
        - data/raw/experiments/source-comparison/manifests/${key}
        - ${experiments.source_comparison.domains}
        - .semflow/hashes/entrypoints/pipeline/stages/raw/sample-comparison.json
      outs:
        - data/raw/experiments/source-comparison/samples/${key}

  compare_sources:
    desc: Compare observed yield, acquisition sizes and exploratory population estimates.
    cmd: >-
      env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python
      --offline --frozen --package ccfinance-pipeline pipeline stages research compare-sources
      --manifests data/raw/experiments/source-comparison/manifests
      --samples data/raw/experiments/source-comparison/samples
      --output data/research/experiments/source-comparison
    deps:
      - data/raw/experiments/source-comparison/manifests
      - data/raw/experiments/source-comparison/samples
      - .semflow/hashes/entrypoints/pipeline/stages/research/compare-sources.json
    params:
      - experiments.source_comparison
    outs:
      - data/research/experiments/source-comparison/comparison.csv
      - data/research/experiments/source-comparison/methods.json
      - data/research/experiments/source-comparison/summary.tex
    metrics:
      - data/research/experiments/source-comparison/metrics.json

  sample_article_metadata:
    desc: Draw a seeded article sample, plus authored diagnostics, for the benchmark.
    cmd: >-
      env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python
      --offline --frozen --package ccfinance-pipeline pipeline stages processed
      sample-articles --source data/raw/fine-news
      --diagnostics data/inputs/article-metadata/diagnostics.jsonl
      --size ${article_metadata.sample_size} --seed ${article_metadata.seed}
      --output data/processed/experiments/article-metadata/sample
    params:
      - article_metadata.sample_size
      - article_metadata.seed
    deps:
      - data/raw/fine-news
      - data/inputs/article-metadata/diagnostics.jsonl
      - .semflow/hashes/entrypoints/pipeline/stages/processed/sample-articles.json
    outs:
      - data/processed/experiments/article-metadata/sample

  benchmark_article_metadata:
    desc: Run the production extractor on the sample to gate the full corpus run.
    cmd: >-
      bash infra/inference/gliner-run.sh gliner2.5-small-v1
      --source data/processed/experiments/article-metadata/sample
      --output data/processed/experiments/article-metadata/benchmark
      --seed ${article_metadata.seed} --batch-size ${article_metadata.batch_size}
      --buffer-size ${article_metadata.buffer_size} --workers ${article_metadata.workers}
      --chunk-size ${article_metadata.chunk_size}
      --chunk-overlap ${article_metadata.chunk_overlap}
    params:
      - article_metadata
    deps:
      - data/processed/experiments/article-metadata/sample
      - infra/inference/gliner2-2.1.0-cuda-attributes.patch
      - infra/inference/gliner2-2.1.0-window-offsets.patch
      - infra/inference/gliner2-2.1.0-batched-attributes.patch
      - infra/inference/gliner_extract.py
      - infra/inference/gliner_schema.py
      - infra/inference/gliner_runtime.py
      - infra/inference/gliner_attributes.py
      - infra/inference/gliner_probabilities.py
    outs:
      - data/processed/experiments/article-metadata/benchmark

  report_article_metadata:
    desc: Report benchmark throughput, company coverage and score spread.
    cmd: >-
      env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python
      --offline --frozen --package ccfinance-pipeline pipeline stages research
      report-article-metadata --benchmark data/processed/experiments/article-metadata/benchmark
      --diagnostics data/inputs/article-metadata/diagnostics.jsonl
      --output data/research/experiments/article-metadata
    deps:
      - data/processed/experiments/article-metadata/benchmark
      - data/inputs/article-metadata/diagnostics.jsonl
      - .semflow/hashes/entrypoints/pipeline/stages/research/report-article-metadata.json
    outs:
      - data/research/experiments/article-metadata/diagnostics.json
    metrics:
      - data/research/experiments/article-metadata/metrics.json

  extract_article_metadata:
    desc: Extract typed mentions, company scores, article form and event families.
    # Long-running and resumable: launch with `just inference::extract` outside
    # DVC, rerun it to resume, then record the completed output with `dvc commit`.
    cmd: >-
      bash infra/inference/gliner-run.sh gliner2.5-small-v1
      --source data/raw/fine-news
      --output data/processed/article-metadata
      --seed ${article_metadata.seed} --batch-size ${article_metadata.batch_size}
      --buffer-size ${article_metadata.buffer_size} --workers ${article_metadata.workers}
      --chunk-size ${article_metadata.chunk_size}
      --chunk-overlap ${article_metadata.chunk_overlap}
    params:
      - article_metadata
    deps:
      - data/raw/fine-news
      - infra/inference/gliner2-2.1.0-cuda-attributes.patch
      - infra/inference/gliner2-2.1.0-window-offsets.patch
      - infra/inference/gliner2-2.1.0-batched-attributes.patch
      - infra/inference/gliner_extract.py
      - infra/inference/gliner_schema.py
      - infra/inference/gliner_runtime.py
      - infra/inference/gliner_attributes.py
      - infra/inference/gliner_probabilities.py
    outs:
      - data/processed/article-metadata:
          persist: true

  snapshot_public_float:
    frozen: true
    desc: Snapshot SEC public float, the size measure on annual report covers.
    # Needs network access and SEC_USER_AGENT ("Name contact@example.org").
    # Frozen once recorded, so later runs verify the snapshot instead of refetching.
    cmd: >-
      env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python
      --offline --frozen --package ccfinance-pipeline pipeline stages raw
      snapshot-public-float --first-year ${public_float.first_year}
      --last-year ${public_float.last_year} --output data/raw/public-float
    params:
      - public_float
    deps:
      - .semflow/hashes/entrypoints/pipeline/stages/raw/snapshot-public-float.json
    outs:
      - data/raw/public-float

  prepare_public_float:
    desc: Tabulate public float by filer and measurement date.
    cmd: >-
      env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python
      --offline --frozen --package ccfinance-pipeline pipeline stages processed
      prepare-public-float --source data/raw/public-float
      --output data/processed/public-float
    deps:
      - data/raw/public-float
      - .semflow/hashes/entrypoints/pipeline/stages/processed/prepare-public-float.json
    outs:
      - data/processed/public-float

  prepare_articles:
    desc: Date-check and deduplicate articles, with article form and syndication copies.
    cmd: >-
      env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python
      --offline --frozen --package ccfinance-pipeline pipeline stages processed
      prepare-articles --source data/raw/fine-news
      --extraction data/processed/article-metadata
      --max-lag-days ${articles.max_lag_days} --output data/processed/articles
    params:
      - articles.max_lag_days
    deps:
      - data/raw/fine-news
      - data/processed/article-metadata
      - .semflow/hashes/entrypoints/pipeline/stages/processed/prepare-articles.json
    outs:
      - data/processed/articles

  link_company_mentions:
    desc: Link GLiNER company mentions to dated US-listed issuers, with scores.
    # Resumable by row group. While extraction is partial, run it alone with
    # `just dvc repro --single-item link_company_mentions`.
    cmd: >-
      env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python
      --offline --frozen --package ccfinance-pipeline pipeline stages processed
      link-companies --extraction data/processed/article-metadata
      --source data/raw/fine-news --issuers data/processed/issuers
      --domains data/inputs/fine-news/domains.csv
      --publishers data/inputs/company-links/publishers.csv
      --smoothing ${company_links.smoothing} --recover-names --output data/processed/company-links
    params:
      - company_links.smoothing
    deps:
      - data/processed/article-metadata
      - data/raw/fine-news
      - data/processed/issuers
      - data/inputs/fine-news/domains.csv
      - data/inputs/company-links/publishers.csv
      - .semflow/hashes/entrypoints/pipeline/stages/processed/link-companies.json
    outs:
      - data/processed/company-links

  sample_company_links:
    desc: Draw a linker-independent evaluation sample of company mentions and articles.
    cmd: >-
      env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python
      --offline --frozen --package ccfinance-pipeline pipeline stages processed
      sample-links --extraction data/processed/article-metadata
      --issuers data/processed/issuers --source data/raw/fine-news
      --per-stratum ${company_links.per_stratum} --articles ${company_links.articles}
      --window ${company_links.window} --seed ${company_links.seed}
      --output data/processed/experiments/company-links/sample
    params:
      - company_links.per_stratum
      - company_links.articles
      - company_links.window
      - company_links.seed
    deps:
      - data/processed/article-metadata
      - data/processed/issuers
      - data/raw/fine-news
      - .semflow/hashes/entrypoints/pipeline/stages/processed/sample-links.json
    outs:
      - data/processed/experiments/company-links/sample

  adjudicate_company_links:
    desc: Label the sample with primary, repeat and audit models, reusing cached judgements.
    # Needs `codex login`. Only judgements missing from labels/cache.jsonl call the model.
    cmd: >-
      env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python
      --offline --frozen --package ccfinance-pipeline pipeline stages processed
      adjudicate-links --sample data/processed/experiments/company-links/sample
      --issuers data/processed/issuers --model ${company_links.model}
      --audit-model ${company_links.audit_model} --effort ${company_links.effort}
      --repeat ${company_links.repeat} --audit ${company_links.audit}
      --concurrency ${company_links.concurrency}
      --output data/processed/experiments/company-links/labels
    params:
      - company_links.model
      - company_links.audit_model
      - company_links.effort
      - company_links.repeat
      - company_links.audit
      - company_links.concurrency
    deps:
      - data/processed/experiments/company-links/sample
      - data/processed/issuers
      - .semflow/hashes/entrypoints/pipeline/stages/processed/adjudicate-links.json
    outs:
      - data/processed/experiments/company-links/labels:
          persist: true

  report_company_links:
    desc: Estimate link precision, recall and score reliability from the labels.
    cmd: >-
      env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python
      --offline --frozen --package ccfinance-pipeline pipeline stages research
      report-company-links --sample data/processed/experiments/company-links/sample
      --labels data/processed/experiments/company-links/labels
      --links data/processed/company-links --issuers data/processed/issuers
      --threshold ${company_links.threshold}
      --output data/research/experiments/company-links
    params:
      - company_links.threshold
    deps:
      - data/processed/experiments/company-links/sample
      - data/processed/experiments/company-links/labels
      - data/processed/company-links
      - data/processed/issuers
      - .semflow/hashes/entrypoints/pipeline/stages/research/report-company-links.json
    outs:
      - data/research/experiments/company-links/errors.csv
      - data/research/experiments/company-links/diagnostics.json
      - data/research/experiments/company-links/summary.tex
    metrics:
      - data/research/experiments/company-links/metrics.json

  report_company_focus:
    desc: Choose the company-focus rule on development articles and score it on test.
    cmd: >-
      env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python
      --offline --frozen --package ccfinance-pipeline pipeline stages research
      report-company-focus --sample data/processed/experiments/company-links/sample
      --labels data/processed/experiments/company-links/labels
      --links data/processed/company-links --issuers data/processed/issuers
      --threshold ${company_links.threshold}
      --min-relevance ${coverage.focus.min_relevance}
      --max-offset ${coverage.focus.max_offset}
      --min-mentions ${coverage.focus.min_mentions}
      --output data/research/experiments/company-focus
    params:
      - company_links.threshold
      - coverage.focus
    deps:
      - data/processed/experiments/company-links/sample
      - data/processed/experiments/company-links/labels
      - data/processed/company-links
      - data/processed/issuers
      - .semflow/hashes/entrypoints/pipeline/stages/research/report-company-focus.json
    outs:
      - data/research/experiments/company-focus/curve.csv
    metrics:
      - data/research/experiments/company-focus/metrics.json

  build_coverage_panel:
    desc: Count each listed issuer's articles by year through the article funnel.
    cmd: >-
      env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python
      --offline --frozen --package ccfinance-pipeline pipeline stages research
      build-coverage-panel --articles data/processed/articles
      --links data/processed/company-links --issuers data/processed/issuers
      --public-float data/processed/public-float
      --roster data/inputs/coverage/pricing-perspective.csv
      --threshold ${company_links.threshold}
      --min-relevance ${coverage.focus.min_relevance}
      --max-offset ${coverage.focus.max_offset}
      --min-mentions ${coverage.focus.min_mentions}
      --first-year ${coverage.first_year} --last-year ${coverage.last_year}
      --complete-from ${coverage.complete_from}
      --complete-through ${coverage.complete_through}
      --size-bands ${coverage.size_bands} --output data/research/coverage
    params:
      - company_links.threshold
      - coverage.focus
      - coverage.first_year
      - coverage.last_year
      - coverage.complete_from
      - coverage.complete_through
      - coverage.size_bands
    deps:
      - data/processed/articles
      - data/processed/company-links
      - data/processed/issuers
      - data/processed/public-float
      - data/inputs/coverage/pricing-perspective.csv
      - .semflow/hashes/entrypoints/pipeline/stages/research/build-coverage-panel.json
    outs:
      - data/research/coverage

  report_coverage:
    desc: Tabulate and chart coverage, dates, the Pricing Perspective screen and quality.
    cmd: >-
      env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python
      --offline --frozen --package ccfinance-pipeline pipeline stages research
      report-coverage --panel data/research/coverage
      --articles data/processed/articles --links data/processed/company-links
      --source data/raw/fine-news
      --link-metrics data/research/experiments/company-links/metrics.json
      --focus data/research/experiments/company-focus
      --threshold ${company_links.threshold}
      --min-relevance ${coverage.focus.min_relevance}
      --max-offset ${coverage.focus.max_offset}
      --min-mentions ${coverage.focus.min_mentions}
      --complete-from ${coverage.complete_from}
      --complete-through ${coverage.complete_through}
      --thresholds ${coverage.thresholds} --spans ${coverage.spans}
      --seed ${coverage.near_duplicates.seed}
      --months ${coverage.near_duplicates.months}
      --sample-size ${coverage.near_duplicates.articles}
      --window-days ${coverage.near_duplicates.window_days}
      --max-candidates ${coverage.near_duplicates.max_candidates}
      --jaccard ${coverage.near_duplicates.jaccard}
      --output data/research/experiments/coverage
    params:
      - company_links.threshold
      - coverage
    deps:
      - data/research/coverage
      - data/processed/articles
      - data/processed/company-links
      - data/raw/fine-news
      - data/research/experiments/company-links/metrics.json
      - data/research/experiments/company-focus/metrics.json
      - data/research/experiments/company-focus/curve.csv
      - .semflow/hashes/entrypoints/pipeline/stages/research/report-coverage.json
    outs:
      - data/research/experiments/coverage/tables
      - data/research/experiments/coverage/figures
    metrics:
      - data/research/experiments/coverage/metrics.json

  render_coverage_report:
    desc: Build the coverage report PDF with Tectonic from cached TeX resources.
    # Run `just latex::setup` once to cache the report's TeX packages and fonts.
    cmd: >-
      cp src/latex/coverage.tex data/research/experiments/coverage/report.tex
      && just latex::render data/research/experiments/coverage/report.tex
    deps:
      - src/latex/coverage.tex
      - src/latex/justfile
      - data/research/experiments/coverage/tables
      - data/research/experiments/coverage/figures
    outs:
      - data/research/experiments/coverage/report.pdf

  sample_metadata_pilot:
    desc: Draw development articles, company mentions and windows from the usable corpus.
    cmd: >-
      env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python
      --offline --frozen --package ccfinance-pipeline pipeline stages processed
      sample-metadata-pilot --articles data/processed/articles/articles.parquet
      --extraction data/processed/article-metadata
      --output data/processed/experiments/article-metadata/pilot.parquet
    deps:
      - .semflow/hashes/entrypoints/pipeline/stages/processed/sample-metadata-pilot.json
      - data/processed/articles/articles.parquet
      - data/processed/article-metadata
    outs:
      - data/processed/experiments/article-metadata/pilot.parquet

  sample_metadata_confirmation:
    desc: Draw blinded confirmation units and record stratum weights and audit membership.
    cmd: >-
      env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python
      --offline --frozen --package ccfinance-pipeline pipeline stages processed
      sample-metadata-confirmation --articles data/processed/articles/articles.parquet
      --extraction data/processed/article-metadata
      --pilot data/processed/experiments/article-metadata/pilot.parquet
      --output data/processed/experiments/article-metadata/confirmation.parquet
    deps:
      - .semflow/hashes/entrypoints/pipeline/stages/processed/sample-metadata-confirmation.json
      - data/processed/articles/articles.parquet
      - data/processed/article-metadata
      - data/processed/experiments/article-metadata/pilot.parquet
    outs:
      - data/processed/experiments/article-metadata/confirmation.parquet

  judge_metadata_confirmation:
    foreach: ${metadata_judges}
    do:
      cmd: >-
        env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python
        --offline --frozen --package ccfinance-pipeline pipeline stages processed
        judge-metadata --sample data/processed/experiments/article-metadata/confirmation.parquet
        --source data/raw/fine-news --role ${key} --model ${item}
        --output data/processed/experiments/article-metadata/validation-labels/${key}
      deps:
        - .semflow/hashes/entrypoints/pipeline/stages/processed/judge-metadata.json
        - data/processed/experiments/article-metadata/confirmation.parquet
        - data/raw/fine-news
      outs:
        - data/processed/experiments/article-metadata/validation-labels/${key}:
            persist: true

  report_metadata_validation:
    cmd: >-
