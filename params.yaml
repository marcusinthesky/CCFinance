# Company links: linker prior smoothing and the adjudicated evaluation sample.
company_links:
  smoothing: 1.0
  # Seed 42 drew the development sample used to choose the rules; seed 43 draws
  # the confirmation sample, labelled from scratch after the rules were fixed.
  seed: 43
  per_stratum: 200
  articles: 400
  window: 750
  model: openai-codex:gpt-6-luna
  audit_model: openai-codex:gpt-6.1-terra
  effort: low
  repeat: 0.1
  audit: 0.2
  concurrency: 8
  threshold: 0.5

# Articles: a publication date dates the text only if captured within this many
# days; the lag distribution has its knee here (63% same day, 2.9M over a year).
articles:
  max_lag_days: 7

# Public float: SEC XBRL frames for every quarter of these calendar years.
public_float:
  first_year: 2015
  last_year: 2026

# Issuers: US-listed SEC filers with dated tickers and aliases, for company linking.
issuers:
  since: "2016-01-01"
  min_sitelinks: 10

# Article metadata: GLiNER2.5 Small extraction, shared by benchmark and corpus runs.
article_metadata:
  seed: 42
  sample_size: 10000
  batch_size: 128
  buffer_size: 8192
  workers: 4
  chunk_size: 384
  chunk_overlap: 64

# Source comparison: English publisher-filter yield, before research qualification.
experiments:
  source_comparison:
    # Four independent file/group draws with replacement; keep duplicate draws.
    seed: 42
    draws: 4
    domains: data/inputs/fine-news/domains.csv
    datasets:
      fine_news:
        source: hf://datasets/ksolovev/fine-news@7a841090e69f3c58a9e04b0c39213d879af68e8a/data/*/eng_Latn/*.parquet
      infini_news:
        source: hf://datasets/ruggsea/infini-news-corpus@7f8fe13b0833c005365b81f1dee7c20b7087769b/data/year=*/month=*/part-*.parquet
      refinedweb:
        source: hf://datasets/tiiuae/falcon-refinedweb@c735840575b629292b41da8dde11dcd523d4f91c/data/*.parquet
      fineweb_hq:
        source: hf://datasets/epfml/FineWeb-HQ@e58199cdd52438d94405df1a4d8630cc5f13bf84/data/*/*.parquet
    # DCLM is deferred: original compressed JSONL needs whole-file transfer;
    # its partial converted Parquet is not a frame for the complete population.
