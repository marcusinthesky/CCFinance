[project]
name = "ccfinance-pipeline"
version = "0.1.0"
description = "Reproducible CCFinance data engineering stages"
requires-python = ">=3.13,<3.14"
dependencies = [
  "duckdb==1.5.6",
  "huggingface-hub>=1.0,<2",
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "pydantic>=2,<3",
  "pyyaml>=6,<7",
  "statsmodels>=0.14.6,<1",
  "typer>=0.16,<1",
  "pydantic-ai-slim[openai]==2.68.0",
]

[project.scripts]
pipeline = "pipeline.cli:app"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
