[project]
name = "ccfinance-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

[tool.uv]
package = false

[tool.uv.sources]
semflow = { git = "https://github.com/marcusinthesky/semflow", rev = "480f5932ff868783fe06a9c42cca6a37c37e086f" }
pytest-layout-enforcer = { git = "https://github.com/marcusinthesky/pytest-layout-enforcer", rev = "4a1911f444e30328e7e01a0c885f24486807021b" }

[tool.uv.workspace]
members = ["apps/*"]

[dependency-groups]
dev = [
  "hatchling==1.27.0",
  "hypothesis>=6,<7",
  "pytest==9.1.1",
  "pytest-xdist>=3.8,<5",
  "pytest-testmon>=2.3,<3",
  "tach==0.35.3",
  "ruff==0.14.5",
  "pyrefly==0.64.1",
  "dvc>=3.63,<4",
  "semflow",
  "pytest-layout-enforcer",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ANN", "D", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
preset = "strict"
project-includes = ["apps"]
python-version = "3.13"

[tool.pytest.ini_options]
testpaths = ["apps"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
markers = [
  "unit: isolated behavior",
  "component: coherent subsystem behavior",
  "integration: interaction across components or real dependencies",
  "e2e: complete user-visible workflow",
  "slow: consistently takes more than two seconds",
  "external: accesses a live external service",
]

[tool.pytest-layout-enforcer]
enabled = true
feature-separator = "__"
require-tests = false
include-init = false
include-packages = true

[[tool.pytest-layout-enforcer.layouts]]
source = "apps/pipeline/src/pipeline"
tests = "apps/pipeline/tests"
